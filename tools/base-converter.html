<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进制转换 - 老肥工具箱</title>
<script src="../theme.js"></script>
<style>
:root{--bg:#f0f2f5;--surface:#fff;--text:#333;--text2:#666;--text3:#999;--border:#d9d9d9;--input-bg:#fff;--panel-shadow:0 2px 12px rgba(0,0,0,.06);--result-bg:#f7f8fc;--accent:#667eea;--error:#e74c3c;--error-bg:#fff5f5;--hint-border:#eee;--copy-hover-bg:#f0f1ff;--copy-success-bg:#f0fdf4;--copy-success-color:#27ae60}
[data-theme="dark"]{--bg:#0f0f17;--surface:#1a1a28;--text:#e0e0ec;--text2:#aaa;--text3:#777;--border:#333;--input-bg:#1e1e2e;--panel-shadow:0 2px 12px rgba(0,0,0,.2);--result-bg:#1e1e2e;--accent:#8b9cf7;--error:#f87171;--error-bg:rgba(231,76,60,.1);--hint-border:#2a2a3e;--copy-hover-bg:rgba(102,126,234,.15);--copy-success-bg:rgba(39,174,96,.15);--copy-success-color:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.topbar{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px}
.topbar a{color:rgba(255,255,255,.85);text-decoration:none;font-size:14px;transition:color .2s}
.topbar a:hover{color:#fff}
.topbar h1{font-size:18px;font-weight:600}
.container{max-width:720px;margin:28px auto;padding:0 16px 60px}
.panel{background:var(--surface);border-radius:12px;padding:28px;box-shadow:var(--panel-shadow)}
.row{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.base-label{width:92px;flex-shrink:0;font-size:13px;color:var(--text2);font-weight:500;display:flex;align-items:center;gap:6px}
.base-badge{display:inline-block;padding:2px 8px;border-radius:4px;color:#fff;font-size:10px;font-weight:600;width:32px;text-align:center}
.base-badge.b2{background:#e67e22}
.base-badge.b8{background:#27ae60}
.base-badge.b10{background:#667eea}
.base-badge.b16{background:#e74c3c}
input[type="text"]{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:"SF Mono","Fira Code",monospace;transition:border .2s;min-width:0;background:var(--input-bg);color:var(--text)}
input[type="text"]:focus{outline:none;border-color:var(--accent)}
input.error{border-color:var(--error);background:var(--error-bg)}
.copy-btn{padding:9px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:12px;color:var(--text2);transition:all .2s;flex-shrink:0}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--copy-hover-bg)}
.copy-btn.copied{border-color:var(--copy-success-color);color:var(--copy-success-color);background:var(--copy-success-bg)}
.hint{font-size:12px;color:var(--text3);margin-top:12px;padding-top:14px;border-top:1px dashed var(--hint-border);line-height:1.8}
.hint strong{color:var(--text2)}
.hint code{background:var(--result-bg);padding:1px 6px;border-radius:3px;font-size:11px;color:var(--accent)}
.extras{margin-top:18px;padding:14px;background:var(--result-bg);border-radius:8px;font-size:13px}
.extras-title{font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600}
.extras-row{display:flex;justify-content:space-between;padding:4px 0;font-family:"SF Mono","Fira Code",monospace;color:var(--text)}
.extras-row span:first-child{color:var(--text3);font-family:inherit}
.err-msg{color:var(--error);font-size:12px;margin-top:4px;padding-left:102px}
</style>
</head>
<body>
<div class="topbar">
  <a href="../index.html">← 返回首页</a>
  <h1>🔢 进制转换</h1>
</div>
<div class="container">
  <div class="panel">
    <div class="row">
      <span class="base-label"><span class="base-badge b2">BIN</span>二进制</span>
      <input type="text" id="bin2" placeholder="如：101011" oninput="convert(2)" autocomplete="off">
      <button class="copy-btn" onclick="copyVal('bin2',this)">复制</button>
    </div>
    <div class="row">
      <span class="base-label"><span class="base-badge b8">OCT</span>八进制</span>
      <input type="text" id="bin8" placeholder="如：53" oninput="convert(8)" autocomplete="off">
      <button class="copy-btn" onclick="copyVal('bin8',this)">复制</button>
    </div>
    <div class="row">
      <span class="base-label"><span class="base-badge b10">DEC</span>十进制</span>
      <input type="text" id="bin10" placeholder="如：43" oninput="convert(10)" autocomplete="off">
      <button class="copy-btn" onclick="copyVal('bin10',this)">复制</button>
    </div>
    <div class="row">
      <span class="base-label"><span class="base-badge b16">HEX</span>十六进制</span>
      <input type="text" id="bin16" placeholder="如：2B" oninput="convert(16)" autocomplete="off">
      <button class="copy-btn" onclick="copyVal('bin16',this)">复制</button>
    </div>
    <div id="errMsg" class="err-msg" style="display:none"></div>

    <div class="extras" id="extras" style="display:none">
      <div class="extras-title">📊 额外信息</div>
      <div class="extras-row"><span>位数 (二进制)</span><span id="bits">-</span></div>
      <div class="extras-row"><span>字节数</span><span id="bytes">-</span></div>
      <div class="extras-row"><span>ASCII 字符</span><span id="ascii">-</span></div>
      <div class="extras-row"><span>科学计数法</span><span id="sci">-</span></div>
    </div>

    <div class="hint">
      <strong>支持格式：</strong>十六进制可带 <code>0x</code> 前缀或不带，二进制可带 <code>0b</code> 前缀<br>
      <strong>提示：</strong>修改任一输入框，其他三个会自动同步转换
    </div>
  </div>
</div>

<script>
const ids = { 2: 'bin2', 8: 'bin8', 10: 'bin10', 16: 'bin16' };
const validChars = { 2: /^[01]+$/, 8: /^[0-7]+$/, 10: /^\d+$/, 16: /^[0-9a-fA-F]+$/ };

function normalize(val, base) {
  val = val.trim().toLowerCase();
  if (base === 16 && val.startsWith('0x')) val = val.slice(2);
  if (base === 2 && val.startsWith('0b')) val = val.slice(2);
  return val;
}

function convert(fromBase) {
  const el = document.getElementById(ids[fromBase]);
  const errEl = document.getElementById('errMsg');
  const raw = el.value;
  const val = normalize(raw, fromBase);

  // 清空其他输入框
  const clearOthers = () => {
    for (const b of [2, 8, 10, 16]) {
      if (b !== fromBase) document.getElementById(ids[b]).value = '';
    }
    document.getElementById('extras').style.display = 'none';
  };

  if (!val) { clearOthers(); errEl.style.display = 'none'; el.classList.remove('error'); return; }

  if (!validChars[fromBase].test(val)) {
    el.classList.add('error');
    errEl.textContent = `❌ 不是有效的${base2Name(fromBase)}：包含非法字符`;
    errEl.style.display = 'block';
    clearOthers();
    return;
  }

  // 超长处理：用 BigInt
  let num;
  try {
    num = BigInt(fromBase === 10 ? val : '0' + (fromBase === 2 ? 'b' : fromBase === 8 ? 'o' : 'x') + val);
  } catch (e) {
    el.classList.add('error');
    errEl.textContent = '❌ 数值解析失败';
    errEl.style.display = 'block';
    return;
  }

  el.classList.remove('error');
  errEl.style.display = 'none';

  // 更新其他三个进制
  for (const b of [2, 8, 10, 16]) {
    if (b !== fromBase) {
      const target = document.getElementById(ids[b]);
      const str = num.toString(b);
      target.value = b === 16 ? str.toUpperCase() : str;
      target.classList.remove('error');
    }
  }

  // 额外信息
  updateExtras(num);
}

function updateExtras(num) {
  const extras = document.getElementById('extras');
  const bin = num.toString(2);
  const bits = bin.length;
  const bytes = Math.ceil(bits / 8);

  document.getElementById('bits').textContent = bits + ' 位';
  document.getElementById('bytes').textContent = bytes + ' 字节';

  // ASCII
  const n = Number(num);
  if (n >= 32 && n <= 126 && Number.isInteger(n)) {
    document.getElementById('ascii').textContent = '"' + String.fromCharCode(n) + '"';
  } else {
    document.getElementById('ascii').textContent = n >= 0 && n <= 31 ? '(控制字符)' : '-';
  }

  // 科学计数法
  document.getElementById('sci').textContent = n < 1e21 ? n.toExponential(4) : num.toString();

  extras.style.display = 'block';
}

function base2Name(b) {
  return { 2: '二进制', 8: '八进制', 10: '十进制', 16: '十六进制' }[b];
}

function copyVal(id, btn) {
  const el = document.getElementById(id);
  if (!el.value) return;
  navigator.clipboard.writeText(el.value).then(() => {
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  });
}
</script>
</body>
</html>

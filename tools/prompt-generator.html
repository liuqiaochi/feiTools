// 按短语长度降序排列，优先匹配长短语

// ═══ 状态 ═══
const selected = {}; // { tagName: weight }

function initTags() {
  const panel = document.getElementById('tagPanel');
  let html = '<div class="panel-title">🏷 选择标签（点击添加，可调权重）</div>';
  for (const [group, tags] of Object.entries(TAG_DB)) {
    html += `<div class="tag-group"><div class="tag-group-label">${group}</div><div class="tags">`;
    for (const t of tags) {
      html += `<span class="tag" data-tag="${t}" onclick="toggleTag(this,'${t}')">${t}</span>`;
    }
    html += '</div></div>';
  }
  html += '<hr><div class="tag-group"><div class="tag-group-label">反向提示词预设</div><div class="tags">';
  for (const name of Object.keys(NEGATIVE_PRESETS)) {
    html += `<span class="tag" data-neg="${name}" onclick="selectNeg(this,'${esc(name)}')">${name}</span>`;
  }
  html += '</div></div>';
  panel.innerHTML = html;
}

let selectedNeg = '通用高质量';

function toggleTag(el, tag) {
  if (selected[tag] !== undefined) {
    delete selected[tag];
    el.classList.remove('selected');
    el.innerHTML = tag;
  } else {
    selected[tag] = 1.0;
    el.classList.add('selected');
    updateTagEl(el, tag);
  }
}

function updateTagEl(el, tag) {
  const w = selected[tag];
  const wStr = w !== 1.0 ? `:${w.toFixed(1)}` : '';
  el.innerHTML = `${tag}<span class="weight">${wStr}</span>` +
    `<span class="weight-ctrl" onclick="event.stopPropagation()">` +
    `<button onclick="adjWeight('${tag}',this,-0.1)">−</button>` +
    `<button onclick="adjWeight('${tag}',this,0.1)">+</button></span>`;
}

function adjWeight(tag, btn, delta) {
  if (selected[tag] === undefined) return;
  selected[tag] = Math.round((selected[tag] + delta) * 10) / 10;
  if (selected[tag] < 0.1) selected[tag] = 0.1;
  if (selected[tag] > 2.0) selected[tag] = 2.0;
  const el = document.querySelector(`.tag[data-tag="${tag}"]`);
  if (el) updateTagEl(el, tag);
}

function selectNeg(el, name) {
  document.querySelectorAll('.tag[data-neg]').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedNeg = name;
}

function formatTag(tag, weight) {
  if (weight === 1.0) return tag;
  return `(${tag}:${weight.toFixed(1)})`;
}

// ═══ 智能中文拆解 ═══
function hasChinese(str) {
  return /[\u4e00-\u9fff]/.test(str);
}

// 从文本中提取已知短语，返回 { matched: [...], remainder: '...' }
function extractPhrases(text) {
  const matched = [];
  let remaining = text;
  for (const [zh, en] of PHRASE_MAP) {
    if (remaining.includes(zh)) {
      matched.push({ zh, en });
      remaining = remaining.split(zh).join(' ');
    }
  }
  // 清理剩余文本中的标点和空白
  remaining = remaining.replace(/[，。、；：！？+\s]+/g, ' ').trim();
  return { matched, remainder: remaining };
}

// 使用 MyMemory 免费翻译 API 翻译剩余中文
async function translateRemaining(text) {
  if (!text || !hasChinese(text)) return text;
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text) + '&langpair=zh-CN|en';
    const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const json = await resp.json();
    if (json.responseStatus === 200 && json.responseData?.translatedText) {
      return json.responseData.translatedText.toLowerCase();
    }
  } catch (e) {
    console.warn('翻译 API 失败:', e);
  }
  return text; // 失败则保留原文
}

// 将翻译结果整理为 SD 标签格式
function toSDTags(text) {
  return text
    .replace(/[.!?;:()（）【】\[\]{}'"'""\s]+/g, ', ')
    .replace(/(, )+/g, ', ')
    .replace(/^[, ]+|[, ]+$/g, '')
    .toLowerCase();
}

async function smartTranslate(input) {
  // 先按中文标点和逗号拆分成片段
  const segments = input.split(/[,，。；;！!？?\n]+/).map(s => s.trim()).filter(Boolean);
  const allTags = [];
  const transLog = [];

  for (const seg of segments) {
    if (!hasChinese(seg)) {
      // 已经是英文，直接用
      allTags.push(seg);
      continue;
    }

    // 1. 先用短语词典提取已知标签
    const { matched, remainder } = extractPhrases(seg);
    for (const m of matched) {
      allTags.push(m.en);
      transLog.push(`${m.zh} → ${m.en}`);
    }

    // 2. 剩余中文用翻译 API
    if (remainder && hasChinese(remainder)) {
      const translated = await translateRemaining(remainder);
      if (translated !== remainder) {
        const tags = toSDTags(translated);
        if (tags) {
          allTags.push(tags);
          transLog.push(`${remainder} → ${tags}`);
        }
      } else {
        allTags.push(remainder);
      }
    } else if (remainder && !hasChinese(remainder)) {
      const tags = toSDTags(remainder);
      if (tags) allTags.push(tags);
    }
  }

  return { tags: allTags, log: transLog };
}

let generating = false;

async function generate() {
  if (generating) return;
  const userRaw = document.getElementById('userInput').value.trim();

  const tagParts = [];
  for (const [tag, w] of Object.entries(selected)) {
    tagParts.push(formatTag(tag, w));
  }

  if (!userRaw && tagParts.length === 0) { alert('请输入关键词或选择标签'); return; }

  const el = document.getElementById('output');
  const genBtn = document.querySelector('.btn');

  // 如果有中文输入，显示加载状态
  if (userRaw && hasChinese(userRaw)) {
    generating = true;
    genBtn.textContent = '⏳ 翻译中...';
    genBtn.style.opacity = '0.6';
    el.innerHTML = '<div style="color:#999;padding:20px;text-align:center">正在智能拆解翻译中文描述...</div>';
  }

  try {
    let userTags = [];
    let transLog = [];

    if (userRaw) {
      if (hasChinese(userRaw)) {
        const result = await smartTranslate(userRaw);
        userTags = result.tags;
        transLog = result.log;
      } else {
        userTags = userRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean);
      }
    }

    const positive = [...userTags, ...tagParts];
    if (positive.length === 0) { alert('翻译结果为空，请换个描述试试'); return; }

    const posStr = positive.join(', ');
    const negStr = NEGATIVE_PRESETS[selectedNeg] || NEGATIVE_PRESETS['通用高质量'];

    let transNote = '';
    if (transLog.length > 0) {
      transNote = `<div style="margin-top:10px;font-size:12px;color:#89b4fa;background:#1e1e2e;padding:12px 14px;border-radius:6px;line-height:1.8">` +
        `📖 翻译对照：<br>${esc(transLog.join('\n'))}</div>`;
    }

    el.innerHTML =
      `<div><div class="output-label">✅ 正向提示词 (Positive Prompt)</div>` +
      `<div class="output-box" id="posBox"><span class="copy-btn" onclick="copyText('posBox')">复制</span>${esc(posStr)}</div>${transNote}</div>` +
      `<div style="margin-top:14px"><div class="output-label output-neg">❌ 反向提示词 (Negative Prompt) — ${esc(selectedNeg)}</div>` +
      `<div class="output-box" id="negBox"><span class="copy-btn" onclick="copyText('negBox')">复制</span>${esc(negStr)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div style="color:#e74c3c;padding:16px">生成失败：${esc(e.message)}</div>`;
  } finally {
    generating = false;
    genBtn.textContent = '🚀 生成提示词';
    genBtn.style.opacity = '1';
  }
}

function randomFill() {
  const pool = Object.values(TAG_DB).flat();
  const picks = [];
  const used = new Set();
  while (picks.length < 6) {
    const t = pool[Math.floor(Math.random() * pool.length)];
    if (!used.has(t)) { used.add(t); picks.push(t); }
  }
  document.getElementById('userInput').value = picks.join(', ');
}

function clearAll() {
  document.getElementById('userInput').value = '';
  document.getElementById('output').innerHTML = '';
  for (const tag of Object.keys(selected)) delete selected[tag];
  document.querySelectorAll('.tag.selected').forEach(el => {
    el.classList.remove('selected');
    const t = el.dataset.tag;
    if (t) el.innerHTML = t;
  });
}

function copyText(id) {
  const el = document.getElementById(id);
  // 获取纯文本，排除复制按钮的文字
  const clone = el.cloneNode(true);
  clone.querySelector('.copy-btn')?.remove();
  navigator.clipboard.writeText(clone.textContent.trim()).then(() => {
    const btn = el.querySelector('.copy-btn');
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

initTags();
// 默认选中通用高质量
document.querySelector('.tag[data-neg="通用高质量"]')?.classList.add('selected');
</script>

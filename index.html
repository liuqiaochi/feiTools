<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老肥工具箱</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
  /* ── 紧凑 Header ── */
  header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .header-left{display:flex;align-items:center;gap:10px}
  .header-left h1{font-size:20px;font-weight:700;white-space:nowrap}
  .header-left span{font-size:12px;opacity:.7}
  .search-wrap{flex:1;min-width:200px;max-width:400px;margin-left:auto}
  .search-box-wrap{position:relative}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none}
  .search-input{width:100%;padding:9px 14px 9px 34px;border:none;border-radius:50px;font-size:13px;background:rgba(255,255,255,.18);color:#fff;outline:none;transition:background .2s;font-family:inherit}
  .search-input::placeholder{color:rgba(255,255,255,.5)}
  .search-input:focus{background:rgba(255,255,255,.28)}
  .search-count{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:rgba(255,255,255,.5)}
  /* ── 容器 ── */
  .container{max-width:1060px;margin:0 auto;padding:20px 16px 40px}
  /* ── 分组 ── */
  .group{margin-bottom:24px}
  .group-title{font-size:13px;color:#999;margin-bottom:10px;padding-left:2px;letter-spacing:1px;text-transform:uppercase}
  /* ── 卡片网格 ── */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer;transition:transform .18s,box-shadow .18s;text-decoration:none;color:inherit;display:flex;align-items:flex-start;gap:12px;border:1px solid transparent}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:rgba(102,126,234,.2)}
  .card-icon{font-size:28px;flex-shrink:0;line-height:1}
  .card-body{min-width:0}
  .card-name{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-desc{font-size:11px;color:#999;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-tag{display:inline-block;margin-top:6px;font-size:10px;padding:2px 8px;border-radius:50px;background:#f0f1ff;color:#667eea}
  /* ── 无结果 ── */
  .no-result{text-align:center;padding:50px 20px;color:#bbb;font-size:14px}
  .no-result .nr-icon{font-size:40px;margin-bottom:10px;opacity:.35}
  /* ── Footer ── */
  footer{text-align:center;padding:16px;color:#ccc;font-size:11px}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>🔧 老肥工具箱</h1>
    <span>实用工具合集</span>
  </div>
  <div class="search-wrap">
    <div class="search-box-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索工具..." autocomplete="off">
      <span class="search-count" id="searchCount"></span>
    </div>
  </div>
</header>
<div class="container">
  <div class="group">
    <div class="group-title">开发工具</div>
    <div class="cards">
      <a class="card" href="tools/timestamp.html">
        <span class="card-icon">⏱</span>
        <div class="card-body">
          <div class="card-name">时间戳转换</div>
          <div class="card-desc">时间戳与日期互转，秒/毫秒切换</div>
          <span class="card-tag">开发</span>
        </div>
      </a>
      <a class="card" href="tools/json-formatter.html">
        <span class="card-icon">📋</span>
        <div class="card-body">
          <div class="card-name">JSON 格式化</div>
          <div class="card-desc">格式化、压缩、高亮，文件导入导出</div>
          <span class="card-tag">开发</span>
        </div>
      </a>
      <a class="card" href="tools/qrcode.html">
        <span class="card-icon">📱</span>
        <div class="card-body">
          <div class="card-name">二维码工具</div>
          <div class="card-desc">生成/解析二维码，自定义样式</div>
          <span class="card-tag">实用</span>
        </div>
      </a>
    </div>
  </div>

  <div class="group">
    <div class="group-title">媒体 & 创作</div>
    <div class="cards">
      <a class="card" href="tools/youtube-dl.html">
        <span class="card-icon">▶️</span>
        <div class="card-body">
          <div class="card-name">YouTube 下载</div>
          <div class="card-desc">解析视频链接，下载视频/音频/封面</div>
          <span class="card-tag">视频</span>
        </div>
      </a>
      <a class="card" href="tools/prompt-generator.html">
        <span class="card-icon">✨</span>
        <div class="card-body">
          <div class="card-name">Lora 提示词</div>
          <div class="card-desc">中文描述生成 SD 英文提示词</div>
          <span class="card-tag">AI 绘画</span>
        </div>
      </a>
      <a class="card" href="tools/pixiv-search.html">
        <span class="card-icon">🎨</span>
        <div class="card-body">
          <div class="card-name">Pixiv 搜图</div>
          <div class="card-desc">搜索插画，标签筛选，瀑布流浏览</div>
          <span class="card-tag">图片</span>
        </div>
      </a>
    </div>
  </div>

</div>
<footer>老肥工具箱 · 持续更新中</footer>
<script>
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');
const groups = document.querySelectorAll('.group');

searchInput.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  let shown = 0;

  groups.forEach(group => {
    const cards = group.querySelectorAll('.card');
    let groupVisible = 0;
    cards.forEach(card => {
      const text = card.textContent.toLowerCase();
      const match = !q || text.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) { groupVisible++; shown++; }
    });
    group.style.display = groupVisible > 0 ? '' : 'none';
  });

  searchCount.textContent = q ? (shown > 0 ? `${shown} 个` : '无结果') : '';

  let noResult = document.getElementById('noResult');
  if (q && shown === 0) {
    if (!noResult) {
      noResult = document.createElement('div');
      noResult.id = 'noResult';
      noResult.className = 'no-result';
      noResult.innerHTML = '<div class="nr-icon">🔍</div><div>没有找到相关工具</div>';
      document.querySelector('.container').appendChild(noResult);
    }
    noResult.style.display = '';
  } else if (noResult) {
    noResult.style.display = 'none';
  }
});
</script>
</body>
</html>
